name: Kiểm thử MoMo Payment

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cài đặt PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, sqlite3
          tools: composer:v2
          coverage: none
      - name: Kiểm tra composer.json
        run: composer validate --strict
      - name: Cài dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Kiểm tra cú pháp PHP
        run: find src tests config -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Chạy PHPUnit
        run: composer test
